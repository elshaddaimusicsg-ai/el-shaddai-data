<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>El Shaddai Attendance</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#f4f1eb;font-family:Georgia,serif;min-height:100vh}
input,button{font-family:Georgia,serif}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1)}
.nav-btn{flex-shrink:0;min-width:64px;padding:10px 4px;border:none;background:none;color:#f4f1eb77;border-bottom:2px solid transparent;font-size:10px;cursor:pointer;transition:all 0.2s;text-align:center}
.nav-btn.active{color:#c8a95a;border-bottom:2px solid #c8a95a}
.card{background:#22223b;border:1px solid #c8a95a33;border-radius:10px;padding:14px;margin-bottom:14px}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;font-family:Georgia,serif;letter-spacing:2px;transition:all 0.3s;text-align:center}
.btn-gold{background:#c8a95a;color:#1a1a2e}
.btn-green{background:#56cf8c;color:#1a1a2e}
.btn-ghost{background:none;border:1px solid #c8a95a55;color:#c8a95a;border-radius:6px;padding:10px;font-size:12px;cursor:pointer;width:100%;font-family:Georgia,serif}
.btn-danger{background:none;border:1px solid #ff444444;color:#ff6666;border-radius:6px;padding:10px;font-size:12px;cursor:pointer;width:100%;font-family:Georgia,serif}
.input{display:block;width:100%;padding:11px 14px;background:#22223b;border:1px solid #c8a95a55;color:#f4f1eb;font-size:14px;border-radius:6px;margin-top:6px;margin-bottom:2px}
.label{font-size:10px;color:#c8a95acc;letter-spacing:1px;display:block;margin-top:12px}
.badge{background:#c8a95a;color:#1a1a2e;border-radius:3px;padding:1px 6px;font-size:9px;font-weight:bold}
.error-box{background:#ff707018;border:1px solid #ff707044;border-radius:6px;padding:10px;font-size:12px;color:#ffaaaa;line-height:1.6;margin-bottom:10px}
table{border-collapse:collapse;min-width:100%;font-size:11px}
th,td{padding:5px 6px;border-bottom:1px solid #c8a95a18;text-align:center;white-space:nowrap}
th{color:#c8a95acc;border-bottom:1px solid #c8a95a33;font-size:10px}
.sticky{position:sticky;left:0;z-index:1;text-align:left;padding:5px 10px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#c8a95a55;border-radius:2px}
</style>
</head>

function today(){return new Date().toISOString().split("T")[0];}
function fmtDate(d){return new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});}
function shortDate(d){return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});}
function haversine(la1,lo1,la2,lo2){const R=6371000,dL=(la2-la1)*Math.PI/180,dO=(lo2-lo1)*Math.PI/180,a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// ── GITHUB API ──
function ghReadHeaders(){
  // No token needed for reading public repos
  return{
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"
  };
}
function ghReadHeaders(){
  // No token needed for reading public repos
  return{
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28",
    "Cache-Control":"no-cache, no-store, must-revalidate",
    "Pragma":"no-cache"
  };
}
function ghWriteHeaders(){
  // Token only needed for writing
  return{
    "Authorization":"Bearer "+S.ghToken,
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28",
    "Content-Type":"application/json"
  };
}
async function ghFetch(path,method,body){
  const isWrite=method&&method!=="GET";
  const url=GH_BASE+path;
  const headers=isWrite?ghWriteHeaders():ghReadHeaders();
  const opts={method:method||"GET",headers,cache:"no-store"};
  if(body)opts.body=JSON.stringify(body);
  let res;
  try{res=await fetch(url,opts);}
  catch(e){throw new Error("Network error: "+e.message);}
  if(res.status===204)return null;
  const text=await res.text();
  if(!res.ok){
    if(res.status===401)throw new Error("401 — Token invalid or expired. Admin needs to update the token in Settings.");
    if(res.status===403)throw new Error("403 — Token lacks repo scope. Regenerate with repo checked.");
    if(res.status===404)throw new Error("404 — Repository not found: "+S.ghRepo);
    throw new Error("GitHub "+res.status+": "+text.slice(0,150));
  }
  try{return JSON.parse(text);}catch(e){throw new Error("Bad JSON response");}
}
async function ghGetFile(fn){
  try{
    const d=await ghFetch("/repos/"+S.ghRepo+"/contents/"+fn);
    const text=decodeURIComponent(escape(atob(d.content.replace(/\n/g,""))));
    return{content:JSON.parse(text),sha:d.sha};
  }catch(e){
    if(e.message.includes("404")||e.message.includes("not found"))return{content:null,sha:null};
    throw e;
  }
}
async function ghPutFile(fn,content,sha){
  const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2))));
  const body={message:"Update "+fn,content:encoded};
  if(sha)body.sha=sha;
  return ghFetch("/repos/"+S.ghRepo+"/contents/"+fn,"PUT",body);
}
async function ghLoadAll(){
  const [mf,af,sf,tf]=await Promise.all([
    ghGetFile("members.json"),
    ghGetFile("attendance.json"),
    ghGetFile("settings.json"),
    ghGetFile("service-types.json")
  ]);
  // Only update if file exists in repo (has content)
  if(mf.content!==null) S.members=mf.content||[];
  if(af.content!==null) S.attendance=af.content||{};
  if(sf.content!==null){
    S.settings=Object.assign({gpsEnabled:"true",gpsLat:"",gpsLng:"",gpsRadius:"200"},sf.content||{});
    S.settingsEdit=Object.assign({},S.settings);
  }
  if(tf.content!==null) S.serviceTypes=tf.content||S.serviceTypes;
}
async function ghSave(what){
  if(!S.ghToken){console.warn("No token — cannot save to GitHub");return;}
  S.syncing=true;render();
  try{
    let fn,data;
    if(what==="members"){fn="members.json";data=S.members;}
    else if(what==="attendance"){fn="attendance.json";data=S.attendance;}
    else if(what==="settings"){fn="settings.json";data=S.settings;}
    else if(what==="serviceTypes"){fn="service-types.json";data=S.serviceTypes;}
    if(fn){
      // Always get fresh SHA before writing to avoid 409 conflicts
      const f=await ghGetFile(fn);
      await ghPutFile(fn,data,f.sha||null);
      console.log("Saved",fn,"to GitHub");
    }
  }catch(e){
    console.error("GitHub save error:",e.message);
    // Show save error to admin
    if(S.loggedIn&&S.loggedIn.isAdmin){
      S.ghError="Save failed: "+e.message;
    }
  }
  S.syncing=false;render();
}

// ── GOOGLE SHEETS API ──
async function gsApi(action,data){
  const url=new URL(S.gsUrl);
  url.searchParams.set("action",action);
  if(data)url.searchParams.set("data",JSON.stringify(data));
  const res=await fetch(url.toString(),{redirect:"follow",mode:"cors"});
  const text=await res.text();
  if(!text||text.includes("<!DOCTYPE"))throw new Error("Got HTML - check Apps Script access is set to 'Anyone'");
  const json=JSON.parse(text);
  if(!json.ok)throw new Error(json.error||"API error");
  return json.data;
}
async function gsLoadAll(){
  const [m,a,s]=await Promise.all([gsApi("getMembers"),gsApi("getAttendance"),gsApi("getSettings")]);
  S.members=m||[];S.attendance=a||{};
  S.settings=Object.assign({gpsEnabled:"true",gpsLat:"",gpsLng:"",gpsRadius:"200"},s||{});
  S.settingsEdit=Object.assign({},S.settings);
}

async function persistServiceTypes(){

}

async function persist(what){
  if(S.ghToken){
    await ghSave(what);
    // Also save locally as backup
    localSave();
  }else if(S.provider==="sheets"&&S.gsConnected){
    S.syncing=true;render();
    try{
      if(what==="members")await gsApi("saveMembers",S.members);
      else if(what==="attendance")await gsApi("saveAttendanceRecord",{date:S.selectedDate,service:S.selectedService,attendanceMap:S.attendance[S.selectedDate+"::"+S.selectedService]||{}});
      else if(what==="settings")await gsApi("saveSettings",S.settings);
    }catch(e){console.error(e);}
    S.syncing=false;render();
  }else{localSave();}
}

// ── CONNECT GITHUB ──
async function connectGitHub(){
  const token=(document.getElementById("ghTokenInput")||{value:""}).value.trim()||S.ghTokenInput;
  const repo=(document.getElementById("ghRepoInput")||{value:""}).value.trim()||S.ghRepoInput;
  if(!token||!repo){S.ghError="Please enter both token and repository name.";render();return;}
  S.ghConnecting=true;S.ghError="";S.ghToken=token;S.ghRepo=repo;render();
  try{
    // Verify repo exists
    await ghFetch("/repos/"+repo,"GET",null);
    // Init files if missing
    const mf=await ghGetFile("members.json");if(!mf.sha)await ghPutFile("members.json",S.members,null);
    const af=await ghGetFile("attendance.json");if(!af.sha)await ghPutFile("attendance.json",S.attendance,null);
    const sf=await ghGetFile("settings.json");if(!sf.sha)await ghPutFile("settings.json",S.settings,null);
    // Load
    await ghLoadAll();
    S.ghConnected=true;S.provider="github";
    LS.set("gh_token",token);LS.set("gh_repo",repo);LS.set("provider","github");
  }catch(e){S.ghError=e.message;S.ghConnected=false;}
  S.ghConnecting=false;render();
}
function disconnectGitHub(){
  S.ghConnected=false;S.provider="local";S.loggedIn=null;S.page="take";
  LS.del("gh_token");LS.del("gh_repo");LS.set("provider","local");
  render();
}

// ── GPS ──
function checkGps(){
  const gs=S.settings,me=S.loggedIn;
  if(me&&me.isAdmin){S.gpsStatus="disabled";S.gpsMessage="⚡ Admin — GPS bypassed";render();return;}
  if(gs.gpsEnabled==="false"){S.gpsStatus="disabled";S.gpsMessage="GPS check disabled";render();return;}
  if(!gs.gpsLat||!gs.gpsLng){S.gpsStatus="disabled";S.gpsMessage="No church location set yet";render();return;}
  if(!navigator.geolocation){S.gpsStatus="fail";S.gpsMessage="GPS not supported on this device";render();return;}
  S.gpsStatus="checking";S.gpsMessage="Checking your location...";render();
  navigator.geolocation.getCurrentPosition(
    pos=>{const d=haversine(pos.coords.latitude,pos.coords.longitude,parseFloat(gs.gpsLat),parseFloat(gs.gpsLng)),r=parseFloat(gs.gpsRadius)||200;
      S.gpsStatus=d<=r?"ok":"fail";
      S.gpsMessage=d<=r?`✓ Within range (${Math.round(d)}m away)`:`✗ Too far (${Math.round(d)}m — must be within ${r}m)`;
      render();},
    ()=>{S.gpsStatus="fail";S.gpsMessage="Location access denied. Please allow location.";render();},
    {enableHighAccuracy:true,timeout:10000}
  );
}
function detectLocation(){
  if(!navigator.geolocation){alert("GPS not supported");return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{S.settingsEdit.gpsLat=pos.coords.latitude.toFixed(6);S.settingsEdit.gpsLng=pos.coords.longitude.toFixed(6);render();},
    ()=>alert("Could not get location. Please allow location access."),{enableHighAccuracy:true}
  );
}

          <button onclick="resetPassword('${esc(name)}')" style="background:none;border:1px solid #58a6ff55;color:#58a6ff;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:10px">🔑 Reset PW</button>
          <button onclick="doRemove('${esc(name)}')" style="background:none;border:1px solid #ff444444;color:#ff6666;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:11px">✕</button>
        </div>`:""}
      </div>`).join("")}`;
  }

  if(S.page==="history"){
    pg=`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <p style="font-size:11px;letter-spacing:2px;color:${ACCENT}cc;margin:0">ATTENDANCE HISTORY</p>
        <div style="display:flex;gap:6px">
          ${allDates.length>0?`<button onclick="exportCSV()" style="background:${GREEN};border:none;border-radius:6px;color:${DARK};padding:7px 12px;font-size:11px;font-weight:bold;cursor:pointer">⬇ CSV</button>`:""}
          ${isAdmin&&allDates.length>0?`<button onclick="S.showClearConfirm=!S.showClearConfirm;S.clearPreview=[];render()" style="background:${RED}22;border:1px solid ${RED}44;color:${RED};border-radius:6px;padding:7px 12px;font-size:11px;font-weight:bold;cursor:pointer">🗑 Clear</button>`:""}
        </div>
      </div>
      ${isAdmin&&S.showClearConfirm?`
      <div style="background:#3a1a1a;border:1px solid ${RED}44;border-radius:10px;padding:16px;margin-bottom:16px">
        <p style="font-size:12px;color:${RED};letter-spacing:1px;margin:0 0 12px;font-weight:bold">🗑 CLEAR ATTENDANCE DATA</p>
        <p style="font-size:12px;color:${LIGHT}88;margin:0 0 12px;line-height:1.6">Select a date range to permanently delete all attendance records within that range.</p>
        <label class="label" style="margin-top:0">FROM DATE</label>
        <input type="date" class="input" id="clearFrom" value="${S.clearFrom}" style="color-scheme:dark;margin-bottom:2px"/>
        <label class="label">TO DATE</label>
        <input type="date" class="input" id="clearTo" value="${S.clearTo}" style="color-scheme:dark;margin-bottom:12px"/>
        <button onclick="previewClear()" style="width:100%;padding:10px;background:none;border:1px solid ${ACCENT}55;color:${ACCENT};border-radius:6px;font-size:13px;cursor:pointer;font-family:Georgia,serif;margin-bottom:10px">
          🔍 Preview Records to Delete
        </button>
        ${S.clearPreview.length>0?`
        <div style="background:${DARK};border:1px solid ${RED}33;border-radius:6px;padding:10px;margin-bottom:12px;max-height:160px;overflow-y:auto">
          <p style="font-size:11px;color:${RED}cc;margin:0 0 8px;letter-spacing:1px">WILL DELETE ${S.clearPreview.length} RECORD${S.clearPreview.length!==1?"S":""}:</p>
          ${S.clearPreview.map(k=>{const[d,sv]=k.split("::");return`<div style="font-size:11px;color:${LIGHT}88;padding:3px 0;border-bottom:1px solid ${ACCENT}11">${fmtDate(d)} — ${esc(sv||"")}</div>`;}).join("")}
        </div>
        <div style="display:flex;gap:8px">
          <button onclick="S.showClearConfirm=false;S.clearPreview=[];S.clearFrom='';S.clearTo='';render()" style="flex:1;padding:11px;background:none;border:1px solid ${ACCENT}44;color:${ACCENT};border-radius:6px;font-size:13px;cursor:pointer;font-family:Georgia,serif">Cancel</button>
          <button onclick="confirmClear()" style="flex:1;padding:11px;background:${RED};border:none;color:#fff;border-radius:6px;font-size:13px;font-weight:bold;cursor:pointer;font-family:Georgia,serif;letter-spacing:1px">⚠️ DELETE</button>
        </div>`:`<button onclick="S.showClearConfirm=false;S.clearPreview=[];render()" style="width:100%;padding:10px;background:none;border:1px solid ${ACCENT}33;color:${LIGHT}66;border-radius:6px;font-size:12px;cursor:pointer;font-family:Georgia,serif">Cancel</button>`}
      </div>`:""}
      ${Object.keys(S.attendance).length===0?`<div style="text-align:center;padding:40px 20px;border:1px dashed ${ACCENT}44;border-radius:10px;color:${LIGHT}55">No records yet.</div>`
      :[...Object.keys(S.attendance)].sort((a,b)=>a<b?1:-1).map(key=>{
        const [date,service]=key.split("::");
        const rec=S.attendance[key]||{};
        const present=mn.filter(n=>rec[n]),absent=mn.filter(n=>!rec[n]);
        return`<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">
          <div style="padding:11px 14px;border-bottom:1px solid ${ACCENT}22">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:13px">${fmtDate(date)}</span>
              <span style="font-size:16px;font-weight:bold;color:${ACCENT}">${present.length}/${mn.length}</span>
            </div>
            <span style="display:inline-block;margin-top:4px;font-size:10px;color:${ACCENT}cc;background:${ACCENT}18;border:1px solid ${ACCENT}33;border-radius:10px;padding:2px 8px">${esc(service||"")}</span>
          </div>
          <div style="padding:10px 14px">
            ${present.length>0?`<div style="margin-bottom:6px"><span style="font-size:10px;color:${GREEN};letter-spacing:1px">PRESENT: </span><span style="font-size:12px;color:${LIGHT}bb">${present.map(esc).join(", ")}</span></div>`:""}
            ${absent.length>0?`<div><span style="font-size:10px;color:${RED};letter-spacing:1px">ABSENT: </span><span style="font-size:12px;color:${LIGHT}55">${absent.map(esc).join(", ")}</span></div>`:""}
          </div>
        </div>`;}).join("")}`;
  }

  if(S.page==="charts"){
    const cRec=S.attendance[S.selectedDate]||{};
    const hasData=Object.keys(cRec).length>0;
    const pCnt=mn.filter(n=>cRec[n]).length,aCnt=mn.length-pCnt;
    const pPct=mn.length>0?Math.round(pCnt/mn.length*100):0;
    pg=`
      <p style="font-size:11px;letter-spacing:2px;color:${ACCENT}cc;margin-bottom:4px">ANALYTICS</p>
      <p style="font-size:12px;color:${LIGHT}66;margin-bottom:12px">${fmtDate(S.selectedDate)}</p>
      <label class="label" style="margin-top:0">SELECT DATE</label>
      <input type="date" class="input" id="chartDate" value="${S.selectedDate}" style="color-scheme:dark;margin-bottom:16px"/>
      ${!hasData?`<div style="text-align:center;padding:40px 20px;border:1px dashed ${ACCENT}44;border-radius:10px;color:${LIGHT}55"><div style="font-size:32px;margin-bottom:12px">📊</div><p>No attendance recorded for this date.</p></div>`:`
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">
        ${[["Present",pCnt,GREEN,"✅"],["Absent",aCnt,RED,"❌"],["Total",mn.length,ACCENT,"👥"]].map(([l,v,c,i])=>`
        <div class="card" style="text-align:center;padding:12px 8px;margin:0">
          <div style="font-size:20px">${i}</div>
          <div style="font-size:20px;font-weight:bold;color:${c};margin:4px 0">${v}</div>
          <div style="font-size:9px;color:${LIGHT}77;letter-spacing:1px">${l.toUpperCase()}</div>
        </div>`).join("")}
      </div>
      <div class="card">
        <p style="margin:0 0 8px;font-size:11px;color:${ACCENT};letter-spacing:1px">PRESENT vs ABSENT</p>
        <div style="display:flex;height:28px;border-radius:6px;overflow:hidden;margin-bottom:8px">
          <div style="flex:${pCnt||0.01};background:${GREEN}"></div><div style="flex:${aCnt||0.01};background:${RED}99"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px">
          <span style="color:${GREEN}">✓ Present: ${pCnt} (${pPct}%)</span><span style="color:${RED}">✗ Absent: ${aCnt}</span>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <p style="margin:0 0 10px;font-size:11px;color:${ACCENT};letter-spacing:1px">MEMBER STATUS</p>
        ${S.members.map(({name})=>{const p=!!cRec[name];return`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid ${ACCENT}18">
          <span style="font-size:13px">${esc(name)}</span>
          <span style="color:${p?GREEN:RED};background:${p?GREEN:RED}22;border:1px solid ${p?GREEN:RED}44;border-radius:4px;padding:3px 10px;font-size:11px;font-weight:bold">${p?"✓ PRESENT":"✗ ABSENT"}</span>
        </div>`;}).join("")}
      </div>
      ${allDates.length>0?`
      <div class="card" style="margin-top:14px">
        <p style="margin:0 0 4px;font-size:11px;color:${ACCENT};letter-spacing:1px">ATTENDANCE GRID</p>
        <p style="margin:0 0 10px;font-size:11px;color:${LIGHT}55">All members × all dates</p>
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table>
          <thead><tr>
            <th class="sticky" style="background:${CARD}">MEMBER</th>
            ${allDates.map(d=>`<th style="min-width:46px">${shortDate(d)}</th>`).join("")}
            <th>TOTAL</th>
          </tr></thead>
          <tbody>${S.members.map(({name},ri)=>{
            const att=allDates.filter(d=>S.attendance[d]&&S.attendance[d][name]).length;
            const pct=allDates.length>0?Math.round(att/allDates.length*100):0;
            const bg=ri%2===0?"#1e1e35":CARD;
            return`<tr><td class="sticky" style="background:${bg}">${esc(name.split(" ")[0])}</td>
            ${allDates.map(d=>{const p=S.attendance[d]&&S.attendance[d][name];return`<td style="${d===S.selectedDate?`background:${ACCENT}18`:""}"><span style="display:inline-block;width:22px;height:22px;border-radius:4px;line-height:22px;font-size:12px;background:${p?GREEN+"33":RED+"22"};color:${p?GREEN:RED};border:1px solid ${p?GREEN:RED}44">${p?"✓":"✗"}</span></td>`;}).join("")}
            <td><span style="font-weight:bold;color:${pct>=75?GREEN:pct>=50?ACCENT:RED}">${att}/${allDates.length}</span></td></tr>`;}).join("")}</tbody>
          <tfoot><tr><td class="sticky" style="background:${CARD};border-top:1px solid ${ACCENT}33;color:${ACCENT}cc;font-weight:bold">TOTAL</td>
            ${allDates.map(d=>{const c=mn.filter(n=>S.attendance[d]&&S.attendance[d][n]).length;return`<td style="${d===S.selectedDate?`background:${ACCENT}18`:""};border-top:1px solid ${ACCENT}33"><span style="font-weight:bold;color:${ACCENT}">${c}</span></td>`;}).join("")}
            <td style="border-top:1px solid ${ACCENT}33">—</td></tr></tfoot>
        </table></div>
      </div>
      <div class="card" style="margin-top:14px">
        <p style="margin:0 0 4px;font-size:11px;color:${ACCENT};letter-spacing:1px">MONTHLY HEATMAP</p>
        <p style="margin:0 0 10px;font-size:11px;color:${LIGHT}55">Attendance rate per month. Sorted lowest first.</p>
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">${(()=>{
          const months=[...new Set(allDates.map(d=>d.slice(0,7)))].sort();
          const mLabel=m=>new Date(m+"-01").toLocaleDateString("en-US",{month:"short",year:"2-digit"});
          const cColor=p=>p===null?"#ffffff08":p===100?GREEN:p>=75?GREEN+"99":p>=50?ACCENT+"99":p>=25?RED+"88":RED;
          const hData=S.members.map(({name})=>{
            const ms=months.map(mon=>{const ds=allDates.filter(d=>d.slice(0,7)===mon);const a=ds.filter(d=>S.attendance[d]&&S.attendance[d][name]).length;return{pct:ds.length>0?Math.round(a/ds.length*100):null};});
            const tot=allDates.filter(d=>S.attendance[d]&&S.attendance[d][name]).length;
            return{name:name.split(" ")[0],ms,overall:allDates.length>0?Math.round(tot/allDates.length*100):0};
          }).sort((a,b)=>a.overall-b.overall);
          return`<table><thead><tr><th class="sticky" style="background:${CARD}">MEMBER</th>${months.map(m=>`<th style="min-width:46px">${mLabel(m)}</th>`).join("")}<th>OVERALL</th></tr></thead>
          <tbody>${hData.map(({name,ms,overall},ri)=>`<tr style="background:${ri%2===0?"#ffffff05":"transparent"}">
            <td class="sticky" style="background:${ri%2===0?"#1e1e35":CARD}">${esc(name)}</td>
            ${ms.map(s=>`<td><div style="margin:0 auto;width:36px;height:24px;border-radius:4px;background:${cColor(s.pct)};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;color:#fff">${s.pct===null?"—":s.pct+"%"}</div></td>`).join("")}
            <td><span style="font-weight:bold;color:${overall>=75?GREEN:overall>=50?ACCENT:RED}">${overall}%</span></td>
          </tr>`).join("")}</tbody></table>`;
        })()}</div>
        <div style="display:flex;gap:10px;margin-top:10px;justify-content:center;flex-wrap:wrap">
          ${[[GREEN,"100%"],[GREEN+"99","75-99%"],[ACCENT+"99","50-74%"],[RED+"88","25-49%"],[RED,"0-24%"]].map(([c,l])=>`<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:${LIGHT}77"><div style="width:12px;height:12px;border-radius:2px;background:${c}"></div>${l}</div>`).join("")}
        </div>
      </div>`:""}`}`;
  }

  if(S.page==="settings"){
    pg=`
      <p style="font-size:11px;letter-spacing:2px;color:${ACCENT}cc;margin-bottom:14px">SETTINGS</p>
      ${!isAdmin?`<div style="background:#3a1a1a;border:1px solid ${RED}44;border-radius:10px;padding:16px;text-align:center"><div style="font-size:28px;margin-bottom:8px">🔒</div><p style="margin:0;font-size:13px;color:${LIGHT}99">Only <strong style="color:${ACCENT}">admins</strong> can change settings.</p></div>`:`
      <div class="card" style="margin-bottom:14px">
        <p style="margin:0 0 14px;font-size:12px;color:${ACCENT};letter-spacing:1px">🎵 SERVICE TYPES</p>
        <p style="font-size:12px;color:${LIGHT}77;margin:0 0 12px">Manage the list of service types members can select when logging attendance.</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
          ${S.serviceTypes.map((st,i)=>`
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:${DARK};border:1px solid ${ACCENT}22;border-radius:8px">
            <span style="font-size:13px">${esc(st)}</span>
            <button onclick="removeServiceType(${i})" style="background:none;border:1px solid #ff444444;color:#ff6666;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:11px">✕</button>
          </div>`).join("")}
        </div>
        <div style="display:flex;gap:8px">
          <input class="input" id="newServiceType" placeholder="e.g. Sunday Mass" value="${esc(S.newServiceType)}" style="margin:0"/>
          <button onclick="addServiceType()" style="padding:10px 16px;background:${ACCENT};border:none;border-radius:6px;color:${DARK};font-weight:bold;font-size:16px;cursor:pointer">+</button>
        </div>
      </div>

      <div class="card">
        <p style="margin:0 0 14px;font-size:12px;color:${ACCENT};letter-spacing:1px">📍 GPS LOCATION CHECK</p>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:${LIGHT}aa;margin-bottom:14px">
          <input type="checkbox" id="gpsEnabled" ${se.gpsEnabled!=="false"?"checked":""} style="width:16px;height:16px;accent-color:${ACCENT}"/> Enable GPS check
        </label>
        <label class="label">RADIUS (METERS)</label><input type="number" class="input" id="gpsRadius" value="${esc(se.gpsRadius)}" style="margin-bottom:2px"/>
        <label class="label">CHURCH LATITUDE</label><input type="text" class="input" id="gpsLat" value="${esc(se.gpsLat)}" placeholder="e.g. 1.352083" style="margin-bottom:2px"/>
        <label class="label">CHURCH LONGITUDE</label><input type="text" class="input" id="gpsLng" value="${esc(se.gpsLng)}" placeholder="e.g. 103.819836" style="margin-bottom:12px"/>
        <button class="btn-ghost" onclick="detectLocation()" style="margin-bottom:${se.gpsLat&&se.gpsLng?4:14}px">📍 Use My Current Location as Church Location</button>
        ${se.gpsLat&&se.gpsLng?`<p style="font-size:11px;color:${LIGHT}55;text-align:center;margin-bottom:14px">${esc(se.gpsLat)}, ${esc(se.gpsLng)}</p>`:""}
        <button class="btn ${S.settingsSaved?"":"btn-gold"}" style="${S.settingsSaved?"background:#2d6a4f;color:#fff":""}" onclick="saveSettings()">
          ${S.settingsSaved?"✓ SETTINGS SAVED!":"SAVE SETTINGS"}
        </button>
      </div>

      <div class="card" style="margin-top:14px">
        <p style="margin:0 0 14px;font-size:12px;color:${ACCENT};letter-spacing:1px">🔑 CHANGE MY PASSWORD</p>
        <label class="label" style="margin-top:0">CURRENT PASSWORD</label>
        <input class="input" type="password" id="changeOldPw" placeholder="Enter current password" value="${esc(S.changeOldPw)}" style="margin-bottom:2px"/>
        <label class="label">NEW PASSWORD</label>
        <input class="input" type="password" id="changeNewPw" placeholder="Enter new password" value="${esc(S.changeNewPw)}" style="margin-bottom:10px"/>
        ${S.changePwError?`<p style="color:${RED};font-size:12px;margin-bottom:8px">${esc(S.changePwError)}</p>`:""}
        <button class="btn ${S.changePwSuccess?"":"btn-gold"}" style="${S.changePwSuccess?"background:#2d6a4f;color:#fff":""}" onclick="doChangePw()">
          ${S.changePwSuccess?"✓ PASSWORD CHANGED!":"CHANGE PASSWORD"}
        </button>
      </div>

      <div style="background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:16px;margin-top:14px">
        <p style="margin:0 0 10px;font-size:12px;color:#58a6ff;letter-spacing:1px">🐙 GITHUB STORAGE</p>
        ${S.ghToken?`
          <p style="font-size:12px;color:${LIGHT}88;margin:0 0 4px">✓ Connected to <strong style="color:#58a6ff">${esc(S.ghRepo)}</strong></p>
          <p style="font-size:11px;color:${LIGHT}55;margin:0 0 12px">Data saved as JSON files in your repo.</p>
          <button onclick="ghLoadAll().then(render)" class="btn-ghost" style="margin-bottom:8px">↺ Reload from GitHub</button>
          <button onclick="disconnectGitHub()" class="btn-danger">Disconnect GitHub</button>
        `:`
          <p style="font-size:12px;color:${LIGHT}77;margin:0 0 10px;line-height:1.6">Store data in a GitHub repository. Free, reliable, no server needed.</p>
          ${S.ghError?`<div class="error-box">${esc(S.ghError)}</div>`:""}
          <label class="label" style="margin-top:0">PERSONAL ACCESS TOKEN</label>
          <input class="input" type="password" id="ghTokenInput" placeholder="ghp_xxxxxxxxxxxx" value="${esc(S.ghTokenInput||S.ghToken)}" style="margin-bottom:2px"/>
          <label class="label">REPOSITORY (username/repo-name)</label>
          <input class="input" id="ghRepoInput" placeholder="e.g. yourname/el-shaddai-data" value="${esc(S.ghRepoInput||S.ghRepo)}" style="margin-bottom:12px"/>
          <button onclick="connectGitHub()" style="width:100%;padding:12px;background:#238636;border:none;border-radius:8px;color:#fff;font-weight:bold;font-size:14px;cursor:pointer;letter-spacing:2px;font-family:Georgia,serif;opacity:${S.ghConnecting?0.7:1}" ${S.ghConnecting?"disabled":""}>
            ${S.ghConnecting?"CONNECTING...":"CONNECT TO GITHUB"}
          </button>
          <div style="margin-top:12px;background:#ffffff08;border-radius:6px;padding:12px;font-size:11px;color:${LIGHT}77;line-height:1.9">
            <strong style="color:#58a6ff">Setup (2 minutes):</strong><br/>
            1. Go to <strong>github.com</strong> → create free account<br/>
            2. Click <strong>+ New repository</strong> → name it <em>el-shaddai-data</em> → set to <strong>Public</strong> → Create<br/>
            3. Click your avatar → <strong>Settings → Developer settings</strong><br/>
            4. <strong>Personal access tokens → Tokens (classic)</strong><br/>
            5. <strong>Generate new token (classic)</strong> → add a Note (e.g. <em>El Shaddai App</em>)<br/>
            6. Set expiration to <strong>No expiration</strong><br/>
            7. Check the <strong>repo</strong> checkbox → click <strong>Generate token</strong><br/>
            8. Copy the token (starts with <em>ghp_</em>) — shown once only!<br/>
            9. Paste token and <em>username/el-shaddai-data</em> above
          </div>
        `}
      </div>

      <div style="background:${GREEN}0d;border:1px solid ${GREEN}33;border-radius:10px;padding:16px;margin-top:14px">
        <p style="margin:0 0 10px;font-size:12px;color:${GREEN};letter-spacing:1px">📊 GOOGLE SHEETS</p>
        ${S.gsConnected?`
          <p style="font-size:12px;color:${LIGHT}88;margin:0 0 12px">✓ Connected. Data syncs to your Google Sheet.</p>
          <button onclick="gsLoadAll().then(render)" class="btn-ghost" style="border-color:${GREEN}55;color:${GREEN};margin-bottom:8px">↺ Reload from Sheet</button>
          <button onclick="disconnectSheets()" class="btn-danger">Disconnect Sheet</button>
        `:`
          <p style="font-size:12px;color:${LIGHT}77;margin:0 0 10px;line-height:1.5">Connect via Google Apps Script Web App URL.</p>
          ${S.gsError?`<div class="error-box">${esc(S.gsError)}</div>`:""}
          <label class="label" style="margin-top:0">APPS SCRIPT WEB APP URL</label>
          <input class="input" id="gsUrlInput" placeholder="https://script.google.com/macros/s/..." value="${esc(S.gsUrlInput||S.gsUrl)}" style="margin-bottom:8px"/>
          <button onclick="testSheetsUrl()" class="btn-ghost" style="margin-bottom:8px">🔗 Test URL in New Tab</button>
          <button onclick="connectSheets()" style="width:100%;padding:12px;background:${GREEN};border:none;border-radius:8px;color:${DARK};font-weight:bold;font-size:14px;cursor:pointer;letter-spacing:2px;font-family:Georgia,serif;opacity:${S.gsConnecting?0.7:1}" ${S.gsConnecting?"disabled":""}>
            ${S.gsConnecting?"CONNECTING...":"CONNECT TO GOOGLE SHEETS"}
          </button>
        `}
      </div>`}`;
  }

  return buildHeader(true,S.loggedIn)+buildNav()+
    (S.ghRepo&&!S.ghConnected&&S.ghError?`<div style="background:#3a1a1a;border-bottom:1px solid #ff707044;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span style="font-size:11px;color:#ff9090">⚠️ GitHub offline — using local data. ${S.ghError.includes("401")?"Token expired.":""}</span>
      <button onclick="window.location.reload()" style="background:none;border:1px solid #ff707055;color:#ff9090;border-radius:4px;padding:3px 8px;font-size:10px;cursor:pointer;font-family:Georgia,serif">↺ Retry</button>
    </div>`:"")
    +`<div style="max-width:500px;margin:0 auto;padding:16px 14px">${pg}</div>`;
}

// ── BIND EVENTS ──
function bindEvents(){
  const bind=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(ev,fn);};
  bind("dateInput","change",e=>{S.selectedDate=e.target.value;render();});
  bind("chartDate","change",e=>{S.selectedDate=e.target.value;render();});
  bind("searchInput","input",e=>{S.searchQ=e.target.value;render();});
  bind("loginInput","input",e=>S.loginInput=e.target.value);
  bind("loginInput","keydown",e=>{if(e.key==="Enter")doLogin();});
  bind("setupName","input",e=>S.newName=e.target.value);
  bind("setupName","keydown",e=>{if(e.key==="Enter")doSetup();});
  bind("newNameInput","input",e=>S.newName=e.target.value);
  bind("newNameInput","keydown",e=>{if(e.key==="Enter")doAddMember();});
  bind("newIsAdmin","change",e=>S.newIsAdmin=e.target.checked);
  bind("loginPw","input",e=>S.loginPassword=e.target.value);
  bind("loginPw","keydown",e=>{if(e.key==="Enter")doLogin();});
  bind("setupPw","input",e=>S.newPassword=e.target.value);
  bind("newPwInput","input",e=>S.newPassword=e.target.value);
  bind("changeOldPw","input",e=>S.changeOldPw=e.target.value);
  bind("changeNewPw","input",e=>S.changeNewPw=e.target.value);
  bind("gpsEnabled","change",e=>S.settingsEdit.gpsEnabled=e.target.checked?"true":"false");
  bind("gpsRadius","input",e=>S.settingsEdit.gpsRadius=e.target.value);
  bind("gpsLat","input",e=>S.settingsEdit.gpsLat=e.target.value);
  bind("gpsLng","input",e=>S.settingsEdit.gpsLng=e.target.value);
  bind("newServiceType","input",e=>S.newServiceType=e.target.value);
  bind("clearFrom","change",e=>S.clearFrom=e.target.value);
  bind("clearTo","change",e=>S.clearTo=e.target.value);
  bind("newServiceType","keydown",e=>{if(e.key==="Enter")addServiceType();});
  bind("ghTokenInput","input",e=>S.ghTokenInput=e.target.value);
  bind("ghRepoInput","input",e=>S.ghRepoInput=e.target.value);
  bind("gsUrlInput","input",e=>S.gsUrlInput=e.target.value);
}

// ── ACTIONS ──
function setPage(p){S.page=p;if(p==="take"&&S.loggedIn)checkGps();render();}
function doLogout(){S.loggedIn=null;S.page="take";S.gpsStatus=null;S.gpsMessage="";render();}

async function doSetup(){
  const name=(document.getElementById("setupName")||{value:S.newName}).value.trim()||S.newName;
  const pw=(document.getElementById("setupPw")||{value:S.newPassword}).value.trim()||S.newPassword;
  if(!name||!pw){S.loginError="Please enter both name and password.";render();return;}
  S.members=[{name,isAdmin:true,password:pw}];
  await persist("members");
  S.loggedIn={name,isAdmin:true,password:pw};S.newName="";S.newPassword="";
  render();setTimeout(checkGps,300);
}

function doLogin(){
  const input=(document.getElementById("loginInput")||{value:S.loginInput}).value.trim()||S.loginInput;
  const pw=(document.getElementById("loginPw")||{value:S.loginPassword}).value.trim()||S.loginPassword;
  const found=S.members.find(m=>m.name.toLowerCase()===input.toLowerCase());
  if(!found){S.loginError="Name not found. Ask an admin to add you.";render();return;}
  if(!found.password){S.loginError="No password set. Ask an admin to reset your password.";render();return;}
  if(found.password!==pw){S.loginError="Incorrect password. Please try again.";render();return;}
  S.loggedIn=found;S.loginError="";S.loginInput="";S.loginPassword="";S.page="take";
  render();setTimeout(checkGps,300);
}

function toggleMember(name){
  const key=S.selectedDate+"::"+S.selectedService;
  const rec=S.attendance[key]||{};
  S.attendance[key]=Object.assign({},rec,{[name]:!rec[name]});
  render();
}

async function doSave(){
  const gpsAllowed=S.loggedIn.isAdmin||S.settings.gpsEnabled==="false"||S.gpsStatus==="ok"||S.gpsStatus==="disabled";
  if(!gpsAllowed)return;
  await persist("attendance");
  S.saved=true;render();setTimeout(()=>{S.saved=false;render();},2000);
}

async function doAddMember(){
  if(!S.loggedIn||!S.loggedIn.isAdmin)return;
  const name=(document.getElementById("newNameInput")||{value:S.newName}).value.trim()||S.newName;
  const pw=(document.getElementById("newPwInput")||{value:S.newPassword}).value.trim()||S.newPassword;
  if(!name){alert("Please enter a name.");return;}
  if(!pw){alert("Please enter a password for this member.");return;}
  if(S.members.find(m=>m.name===name)){alert("Member already exists.");return;}
  S.members=[...S.members,{name,isAdmin:S.newIsAdmin,password:pw}].sort((a,b)=>a.name.localeCompare(b.name));
  S.newName="";S.newIsAdmin=false;S.newPassword="";
  await persist("members");render();
}

async function resetPassword(name){
  const pw=prompt("Set new password for "+name+":");
  if(!pw||!pw.trim())return;
  S.members=S.members.map(m=>m.name===name?Object.assign({},m,{password:pw.trim()}):m);
  await persist("members");render();
}

async function doChangePw(){
  const oldPw=(document.getElementById("changeOldPw")||{value:S.changeOldPw}).value.trim();
  const newPw=(document.getElementById("changeNewPw")||{value:S.changeNewPw}).value.trim();
  if(!oldPw||!newPw){S.changePwError="Please fill in both fields.";render();return;}
  if(oldPw!==S.loggedIn.password){S.changePwError="Current password is incorrect.";render();return;}
  if(newPw.length<4){S.changePwError="New password must be at least 4 characters.";render();return;}
  S.members=S.members.map(m=>m.name===S.loggedIn.name?Object.assign({},m,{password:newPw}):m);
  S.loggedIn=Object.assign({},S.loggedIn,{password:newPw});
  S.changeOldPw="";S.changeNewPw="";S.changePwError="";S.changePwSuccess=true;
  await persist("members");render();
  setTimeout(()=>{S.changePwSuccess=false;render();},2500);
}

async function doRemove(name){
  S.members=S.members.filter(m=>m.name!==name);
  await persist("members");render();
}

async function toggleAdmin(name){
  S.members=S.members.map(m=>m.name===name?Object.assign({},m,{isAdmin:!m.isAdmin}):m);
  await persist("members");render();
}

function previewClear(){
  const from=(document.getElementById("clearFrom")||{value:S.clearFrom}).value||S.clearFrom;
  const to=(document.getElementById("clearTo")||{value:S.clearTo}).value||S.clearTo;
  if(!from||!to){alert("Please select both From and To dates.");return;}
  if(from>to){alert("From date must be before To date.");return;}
  S.clearFrom=from;S.clearTo=to;
  S.clearPreview=Object.keys(S.attendance).filter(key=>{
    const date=key.split("::")[0];
    return date>=from&&date<=to;
  }).sort();
  if(S.clearPreview.length===0){alert("No attendance records found in that date range.");}
  render();
}

async function confirmClear(){
  const count=S.clearPreview.length;
  if(count===0)return;
  const confirmed=confirm("Are you absolutely sure?\n\nThis will permanently delete "+count+" attendance record"+(count!==1?"s":"")+" and cannot be undone.\n\nTap OK to confirm deletion.");
  if(!confirmed)return;
  S.clearPreview.forEach(key=>{delete S.attendance[key];});
  S.showClearConfirm=false;S.clearPreview=[];S.clearFrom="";S.clearTo="";
  await persist("attendance");
  render();
  alert("✓ "+count+" record"+(count!==1?"s":"")+" deleted successfully.");
}

function exportCSV(){
  const allDates=Object.keys(S.attendance).sort((a,b)=>a<b?-1:1);
  const rows=[["Date","Service","Member","Status"]];
  Object.keys(S.attendance).sort().forEach(key=>{const[date,service]=key.split("::");S.members.forEach(({name})=>{rows.push([date,service||"",name,S.attendance[key]&&S.attendance[key][name]?"Present":"Absent"]);});});
  const csv=rows.map(r=>r.map(c=>'"'+c+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="attendance.csv";a.click();
}

async function addServiceType(){
  const val=(document.getElementById("newServiceType")||{value:S.newServiceType}).value.trim()||S.newServiceType;
  if(!val||S.serviceTypes.includes(val))return;
  S.serviceTypes=[...S.serviceTypes,val];
  S.newServiceType="";
  await persistServiceTypes();render();
}

async function removeServiceType(i){
  S.serviceTypes=S.serviceTypes.filter((_,idx)=>idx!==i);
  if(!S.serviceTypes.includes(S.selectedService))S.selectedService=S.serviceTypes[0]||"";
  await persistServiceTypes();render();
}

async function saveSettings(){
  S.settings=Object.assign({},S.settingsEdit);
  LS.set("church_settings",JSON.stringify(S.settings));
  await persist("settings");
  S.settingsSaved=true;render();setTimeout(()=>{S.settingsSaved=false;render();},2000);
}

// ── AUTO REFRESH ──
// Reload data from GitHub when user switches back to the app
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState==="visible"&&S.ghRepo){
    try{await ghLoadAll();}catch(e){console.log("Background refresh failed:",e.message);}
    render();
  }
});

// ── INIT ──
(async function(){
  // Always load local data first so app works immediately
  localLoad();

  if(S.ghRepo){
    document.getElementById("root").innerHTML=`
      <div style="min-height:100vh;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,serif;color:#f4f1eb;padding:20px">
        <img src="${LOGO}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #c8a95a;margin-bottom:16px"/>
        <p style="color:#c8a95a;letter-spacing:2px;font-size:13px">Loading...</p>
      </div>`;
    try{
      await ghLoadAll();
      S.ghConnected=true;S.provider="github";
      console.log("GitHub loaded successfully");
    }catch(e){
      console.error("GitHub load failed:",e.message);
      S.ghConnected=false;
      // Don't block the app — just show a warning banner and use local data
      S.ghError=e.message;
    }
  }
  render();
  if(S.loggedIn)checkGps();
})();else if(S.provider==="sheets"&&S.gsUrl){
    try{await gsLoadAll();S.gsConnected=true;}catch(e){S.gsError=e.message;S.provider="local";}
  }else{
    localLoad();
  }
  render();
  if(S.loggedIn)checkGps();
})();
</script>
</body>

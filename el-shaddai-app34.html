<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>El Shaddai Attendance</title>
<script>
// ── SERVICE WORKER (inline registration) ──
// Registers an inline SW via blob URL so no separate sw.js file is needed.
// Each deploy should bump APP_VERSION to force cache clearing on all clients.
if('serviceWorker' in navigator){
  const APP_VERSION = 'v34';
  const swCode = `
    const CACHE = 'el-shaddai-${APP_VERSION}';
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(
        caches.keys().then(keys =>
          Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
        ).then(() => self.clients.claim())
      );
    });
    self.addEventListener('fetch', e => {
      // Network-first: always try network, fall back to cache
      e.respondWith(
        fetch(e.request).then(resp => {
          if(resp && resp.status === 200 && e.request.method === 'GET'){
            const clone = resp.clone();
            caches.open(CACHE).then(c => c.put(e.request, clone));
          }
          return resp;
        }).catch(() => caches.match(e.request))
      );
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).then(reg => {
    reg.update(); // Check for updates immediately on load
  }).catch(()=>{});
}
</script>

*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#f4f1eb;font-family:Georgia,serif;min-height:100vh}
input,button{font-family:Georgia,serif}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1)}
.nav-btn{flex-shrink:0;min-width:60px;padding:10px 4px;border:none;background:none;color:#f4f1eb77;border-bottom:2px solid transparent;font-size:10px;cursor:pointer;transition:all 0.2s;text-align:center}
.nav-btn.active{color:#c8a95a;border-bottom:2px solid #c8a95a}
.card{background:#22223b;border:1px solid #c8a95a33;border-radius:10px;padding:14px;margin-bottom:14px}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;font-family:Georgia,serif;letter-spacing:2px;transition:all 0.3s;text-align:center}
.btn-gold{background:#c8a95a;color:#1a1a2e}
.btn-green{background:#56cf8c;color:#1a1a2e}
.btn-ghost{background:none;border:1px solid #c8a95a55;color:#c8a95a;border-radius:6px;padding:10px;font-size:12px;cursor:pointer;width:100%;font-family:Georgia,serif}
.btn-danger{background:none;border:1px solid #ff444444;color:#ff6666;border-radius:6px;padding:10px;font-size:12px;cursor:pointer;width:100%;font-family:Georgia,serif}
.input{display:block;width:100%;padding:11px 14px;background:#22223b;border:1px solid #c8a95a55;color:#f4f1eb;font-size:14px;border-radius:6px;margin-top:6px;margin-bottom:2px}
.label{font-size:10px;color:#c8a95acc;letter-spacing:1px;display:block;margin-top:12px}
.badge{background:#c8a95a;color:#1a1a2e;border-radius:3px;padding:1px 6px;font-size:9px;font-weight:bold}
.error-box{background:#ff707018;border:1px solid #ff707044;border-radius:6px;padding:10px;font-size:12px;color:#ffaaaa;line-height:1.6;margin-bottom:10px}
table{border-collapse:collapse;min-width:100%;font-size:11px}
th,td{padding:5px 6px;border-bottom:1px solid #c8a95a18;text-align:center;white-space:nowrap}
th{color:#c8a95acc;border-bottom:1px solid #c8a95a33;font-size:10px}
.sticky{position:sticky;left:0;z-index:1;text-align:left;padding:5px 10px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#c8a95a55;border-radius:2px}
</style>

function shortDate(d){try{return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"});}catch{return d;}}
function haversine(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dO=(d-b)*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dO/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

async function jbRead(){
  const r=await fetch(JB+"/b/"+S.jbBinId+"/latest",{
    headers:{"X-Access-Key":S.jbKey,"X-Bin-Meta":false},
    cache:"no-store"
  });
  if(!r.ok){const t=await r.text();throw new Error("Read failed "+r.status+": "+t.slice(0,100));}
  return r.json();
}

async function jbWrite(data){
  const r=await fetch(JB+"/b/"+S.jbBinId,{
    method:"PUT",
    headers:{"Content-Type":"application/json","X-Access-Key":S.jbKey},
    body:JSON.stringify(data)
  });
  if(!r.ok){const t=await r.text();throw new Error("Write failed "+r.status+": "+t.slice(0,100));}
  return r.json();
}

async function jbLoad(){
  const data=await jbRead();
  if(data.members)S.members=data.members;
  if(data.attendance)S.attendance=data.attendance;
  if(data.settings)S.settings=Object.assign({gpsEnabled:"true",gpsLat:"",gpsLng:"",gpsRadius:"200"},data.settings);
  if(data.serviceTypes&&data.serviceTypes.length)S.serviceTypes=data.serviceTypes;
  S.settingsEdit=Object.assign({},S.settings);
  S.jbOk=true;S.jbErr="";
  console.log("JSONBin loaded. Members:",S.members.length);
}

async function jbSave(){
  if(!S.jbKey||!S.jbBinId){console.warn("No JSONBin config");return;}
  S.syncing=true;render();
  try{
    await jbWrite({
      members:S.members,
      attendance:S.attendance,
      settings:S.settings,
      serviceTypes:S.serviceTypes
    });
    S.jbOk=true;S.jbErr="";
    console.log("JSONBin saved");
  }catch(e){
    console.error("JSONBin save error:",e.message);
    S.jbErr=e.message;
  }
  S.syncing=false;render();
}

async function connectJsonBin(){
  const key=(document.getElementById("jbKeyInput")||{value:""}).value.trim()||S.jbKeyInput;
  const bin=(document.getElementById("jbBinInput")||{value:""}).value.trim()||S.jbBinInput;
  if(!key||!bin){S.jbErr="Please enter both API key and Bin ID.";render();return;}
  S.jbConnecting=true;S.jbErr="";S.jbKey=key;S.jbBinId=bin;render();
  try{
    await jbLoad();
    LS.set("jb_key",key);LS.set("jb_bin",bin);
    S.jbConnecting=false;render();
  }catch(e){
    S.jbErr=e.message;S.jbOk=false;S.jbConnecting=false;render();
  }
}

function disconnectJsonBin(){
  S.jbKey="";S.jbBinId="";S.jbOk=false;S.loggedIn=null;S.page="take";
  LS.del("jb_key");LS.del("jb_bin");render();
}

// ── GPS ──
function checkGps(){
  const g=S.settings,m=S.loggedIn;
  if(m&&m.isAdmin){S.gpsStatus="disabled";S.gpsMessage="⚡ Admin — GPS bypassed";render();return;}
  if(g.gpsEnabled==="false"){S.gpsStatus="disabled";S.gpsMessage="GPS check disabled";render();return;}
  if(!g.gpsLat||!g.gpsLng){S.gpsStatus="disabled";S.gpsMessage="No church location set";render();return;}
  if(!navigator.geolocation){S.gpsStatus="fail";S.gpsMessage="GPS not supported";render();return;}
  S.gpsStatus="checking";S.gpsMessage="Checking location...";render();
  navigator.geolocation.getCurrentPosition(
    p=>{const d=haversine(p.coords.latitude,p.coords.longitude,parseFloat(g.gpsLat),parseFloat(g.gpsLng)),r=parseFloat(g.gpsRadius)||200;
      S.gpsStatus=d<=r?"ok":"fail";
      S.gpsMessage=d<=r?"✓ Within range ("+Math.round(d)+"m)":"✗ Too far ("+Math.round(d)+"m — must be within "+r+"m)";
      render();},
    ()=>{S.gpsStatus="fail";S.gpsMessage="Location denied. Please allow location.";render();},
    {enableHighAccuracy:true,timeout:10000}
  );
}
function detectLoc(){
  navigator.geolocation.getCurrentPosition(
    p=>{S.settingsEdit.gpsLat=p.coords.latitude.toFixed(6);S.settingsEdit.gpsLng=p.coords.longitude.toFixed(6);render();},
    ()=>alert("Could not get location"),{enableHighAccuracy:true}
  );
}

// ── IDLE TIMEOUT (5 minutes) ──
const IDLE_MS = 5 * 60 * 1000;
function resetIdleTimer(){
  if(S.idleTimer)clearTimeout(S.idleTimer);
  if(!S.loggedIn)return;
  S.idleTimer=setTimeout(()=>{
    if(S.loggedIn){
      S.loggedIn=null;S.page="take";S.gpsStatus=null;S.gpsMessage="";
      render();
      // Show a brief notice
      const notice=document.createElement("div");
      notice.style.cssText="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#c8a95a;color:#1a1a2e;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:bold;z-index:9999;font-family:Georgia,serif";
      notice.textContent="⏱ Signed out due to inactivity.";
      document.body.appendChild(notice);
      setTimeout(()=>notice.remove(),3500);
    }
  },IDLE_MS);
}
["click","touchstart","keydown","mousemove","scroll"].forEach(ev=>
  document.addEventListener(ev,resetIdleTimer,{passive:true})
);

        const pr=mn.filter(n=>r2[n]),ab=mn.filter(n=>!r2[n]);
        return`<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">
          <div style="padding:11px 14px;border-bottom:1px solid ${ACCENT}22">
            <div style="display:flex;justify-content:space-between"><span style="font-size:13px">${fmtDate(date)}</span><span style="font-size:16px;font-weight:bold;color:${ACCENT}">${pr.length}/${mn.length}</span></div>
            <span style="display:inline-block;margin-top:4px;font-size:10px;color:${ACCENT}cc;background:${ACCENT}18;border:1px solid ${ACCENT}33;border-radius:10px;padding:2px 8px">${esc(svc||"")}</span>
          </div>
          <div style="padding:10px 14px">
            ${pr.length>0?`<div style="margin-bottom:6px"><span style="font-size:10px;color:${GREEN};letter-spacing:1px">PRESENT: </span><span style="font-size:12px;color:${LIGHT}bb">${pr.map(esc).join(", ")}</span></div>`:""}
            ${ab.length>0?`<div><span style="font-size:10px;color:${RED};letter-spacing:1px">ABSENT: </span><span style="font-size:12px;color:${LIGHT}55">${ab.map(esc).join(", ")}</span></div>`:""}
          </div>
        </div>`;}).join("")}`;
  }

  // ── CHARTS ──
  if(S.page==="charts"){
    const dateKeys=allKeys.filter(k=>k.startsWith(S.selectedDate+"::"));
    const servicesOnDate=dateKeys.map(k=>k.split("::")[1]);
    const cRec={};
    dateKeys.forEach(k=>{Object.assign(cRec,S.attendance[k]||{});});
    const hasData=dateKeys.length>0;
    const pCnt=mn.filter(n=>cRec[n]).length,aCnt=mn.length-pCnt;
    const pPct=mn.length>0?Math.round(pCnt/mn.length*100):0;
    pg=`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <p style="font-size:11px;letter-spacing:2px;color:${ACCENT}cc;margin:0">ANALYTICS</p>
        <button onclick="refreshData()" style="background:none;border:1px solid ${ACCENT}44;color:${ACCENT};border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:Georgia,serif">↺ Refresh</button>
      </div>
      <p style="font-size:12px;color:${LIGHT}66;margin-bottom:10px">${fmtDate(S.selectedDate)}</p>

      ${!hasData?`<div style="text-align:center;padding:40px 20px;border:1px dashed ${ACCENT}44;border-radius:10px;color:${LIGHT}55"><div style="font-size:32px;margin-bottom:12px">📊</div><p>No attendance for this date.</p></div>`:`
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">
        ${[["Present",pCnt,GREEN,"✅"],["Absent",aCnt,RED,"❌"],["Total",mn.length,ACCENT,"👥"]].map(([l,v,c,i])=>`
        <div class="card" style="text-align:center;padding:12px 8px;margin:0">
          <div style="font-size:20px">${i}</div>
          <div style="font-size:20px;font-weight:bold;color:${c};margin:4px 0">${v}</div>
          <div style="font-size:9px;color:${LIGHT}77;letter-spacing:1px">${l.toUpperCase()}</div>
        </div>`).join("")}
      </div>
      <div class="card">
        <p style="margin:0 0 8px;font-size:11px;color:${ACCENT};letter-spacing:1px">PRESENT vs ABSENT</p>
        <div style="display:flex;height:28px;border-radius:6px;overflow:hidden;margin-bottom:8px">
          <div style="flex:${pCnt||0.01};background:${GREEN}"></div><div style="flex:${aCnt||0.01};background:${RED}99"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px">
          <span style="color:${GREEN}">✓ Present: ${pCnt} (${pPct}%)</span><span style="color:${RED}">✗ Absent: ${aCnt}</span>
        </div>
      </div>
      ${servicesOnDate.length>1?`
      <div class="card" style="margin-top:12px">
        <p style="margin:0 0 12px;font-size:11px;color:${ACCENT};letter-spacing:1px">ATTENDANCE BY SERVICE TYPE</p>
        ${servicesOnDate.map(svc=>{const sRec=S.attendance[S.selectedDate+"::"+svc]||{};const sp=mn.filter(n=>sRec[n]).length;const sa=mn.length-sp;const spct=mn.length>0?Math.round(sp/mn.length*100):0;return`
          <div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid ${ACCENT}22">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
              <span style="font-size:13px;color:${LIGHT};font-weight:bold">${esc(svc)}</span>
              <span style="font-size:11px;color:${ACCENT}">${sp}/${mn.length} (${spct}%)</span>
            </div>
            <div style="display:flex;height:18px;border-radius:4px;overflow:hidden;margin-bottom:10px">
              <div style="flex:${sp||0.01};background:${GREEN}"></div>
              <div style="flex:${sa||0.01};background:${RED}99"></div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              ${S.members.map(({name})=>{const p=!!sRec[name];return`<span style="font-size:11px;padding:4px 10px;border-radius:12px;background:${p?"#ffffff18":RED+"22"};color:${p?LIGHT:RED};border:1px solid ${p?"#ffffff33":RED+"55"}">${esc(name.split(" ")[0])}</span>`;}).join("")}
            </div>
          </div>`;}).join("")}
      </div>`:""}

      ${allDates.length>0?`
      <div class="card" style="margin-top:12px">
        <p style="margin:0 0 6px;font-size:11px;color:${ACCENT};letter-spacing:1px">ATTENDANCE GRID & HEATMAP</p>
        <p style="margin:0 0 10px;font-size:11px;color:${LIGHT}55">Tap to load detailed tables (may take a moment)</p>
        <button onclick="loadHeavyCharts()" id="loadChartsBtn" style="width:100%;padding:12px;background:${ACCENT}22;border:1px solid ${ACCENT}55;color:${ACCENT};border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;font-family:Georgia,serif">
          📊 Load Grid & Heatmap
        </button>
        <div id="heavyCharts"></div>
      </div>`:""}
      `}`;
  }

  // ── SETTINGS ──
  if(S.page==="settings"){
    pg=`
      <p style="font-size:11px;letter-spacing:2px;color:${ACCENT}cc;margin-bottom:14px">SETTINGS</p>
      ${!isAdmin?`<div style="background:#3a1a1a;border:1px solid ${RED}44;border-radius:10px;padding:16px;text-align:center"><div style="font-size:28px;margin-bottom:8px">🔒</div><p style="margin:0;font-size:13px;color:${LIGHT}99">Only <strong style="color:${ACCENT}">admins</strong> can change settings.</p></div>`:`
      <div class="card" style="margin-bottom:14px">
        <p style="margin:0 0 14px;font-size:12px;color:${ACCENT};letter-spacing:1px">🎵 SERVICE TYPES</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
          ${S.serviceTypes.map((st,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:${DARK};border:1px solid ${ACCENT}22;border-radius:8px">
            <span style="font-size:13px">${esc(st)}</span>
            <button onclick="removeSvc(${i})" style="background:none;border:1px solid #ff444444;color:#ff6666;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:11px">✕</button>
          </div>`).join("")}
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <input class="input" id="newSvc" placeholder="e.g. Sunday Mass" style="margin:0"/>
          <button onclick="addSvc()" style="padding:10px 16px;background:${ACCENT};border:none;border-radius:6px;color:${DARK};font-weight:bold;font-size:16px;cursor:pointer">+</button>
        </div>
        <button class="btn ${S.svcSaved?"":"btn-gold"}" style="${S.svcSaved?"background:#2d6a4f;color:#fff":""}" onclick="doSaveServiceTypes()">
          ${S.svcSaved?"✓ SERVICE TYPES SAVED!":"SAVE SERVICE TYPES"}
        </button>
      </div>
      <div class="card" style="margin-bottom:14px">
        <p style="margin:0 0 14px;font-size:12px;color:${ACCENT};letter-spacing:1px">📍 GPS LOCATION CHECK</p>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:${LIGHT}aa;margin-bottom:14px">
          <input type="checkbox" id="gpsEnabled" ${se.gpsEnabled!=="false"?"checked":""} style="width:16px;height:16px;accent-color:${ACCENT}"/> Enable GPS check
        </label>
        <label class="label">RADIUS (METERS)</label><input type="number" class="input" id="gpsRadius" value="${esc(se.gpsRadius)}" style="margin-bottom:2px"/>
        <label class="label">CHURCH LATITUDE</label><input type="text" class="input" id="gpsLat" value="${esc(se.gpsLat)}" placeholder="e.g. 1.352083" style="margin-bottom:2px"/>
        <label class="label">CHURCH LONGITUDE</label><input type="text" class="input" id="gpsLng" value="${esc(se.gpsLng)}" placeholder="e.g. 103.819836" style="margin-bottom:12px"/>
        <button class="btn-ghost" onclick="detectLoc()" style="margin-bottom:${se.gpsLat&&se.gpsLng?4:12}px">📍 Use My Current Location</button>
        ${se.gpsLat&&se.gpsLng?`<p style="font-size:11px;color:${LIGHT}55;text-align:center;margin-bottom:12px">${esc(se.gpsLat)}, ${esc(se.gpsLng)}</p>`:""}
        <button class="btn ${S.settingsSaved?"":"btn-gold"}" style="${S.settingsSaved?"background:#2d6a4f;color:#fff":""}" onclick="doSaveSettings()">
          ${S.settingsSaved?"✓ SETTINGS SAVED!":"SAVE GPS SETTINGS"}
        </button>
      </div>`}
      <div class="card" style="margin-bottom:14px">
        <p style="margin:0 0 14px;font-size:12px;color:${ACCENT};letter-spacing:1px">🔑 CHANGE MY PASSWORD</p>
        <label class="label" style="margin-top:0">CURRENT PASSWORD</label><input class="input" type="password" id="cpOld" placeholder="Current password" style="margin-bottom:2px"/>
        <label class="label">NEW PASSWORD</label><input class="input" type="password" id="cpNew" placeholder="New password" style="margin-bottom:10px"/>
        ${S.changePwErr?`<p style="color:${RED};font-size:12px;margin-bottom:8px">${esc(S.changePwErr)}</p>`:""}
        <button class="btn ${S.changePwOk?"":"btn-gold"}" style="${S.changePwOk?"background:#2d6a4f;color:#fff":""}" onclick="doChangePw()">
          ${S.changePwOk?"✓ PASSWORD CHANGED!":"CHANGE PASSWORD"}
        </button>
      </div>
      ${isAdmin?`<div style="background:#1a2a1a;border:1px solid #56cf8c33;border-radius:10px;padding:16px">
        <p style="margin:0 0 10px;font-size:12px;color:${GREEN};letter-spacing:1px">📦 JSONBIN CONNECTION</p>
        <p style="font-size:12px;color:${S.jbOk?GREEN:RED}aa;margin:0 0 10px">${S.jbOk?"✓ Connected — Bin ID: "+S.jbBinId.slice(0,8)+"...":"⚠️ Connected but check status"}</p>
        ${S.jbErr?`<div class="error-box">${esc(S.jbErr)}</div>`:""}
        <button onclick="reloadData()" class="btn-ghost" style="border-color:${GREEN}55;color:${GREEN};margin-bottom:8px">↺ Reload from JSONBin</button>
        <button onclick="disconnectJsonBin()" class="btn-danger">Disconnect JSONBin</button>
      </div>`:""}`
    ;
  }

  return hdr(true,S.loggedIn)+nav+`<div style="max-width:500px;margin:0 auto;padding:16px 14px">${pg}</div>`;
}

// ── BIND EVENTS ──
function bindEvents(){
  const b=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(ev,fn);};
  b("dateInput","change",e=>{S.selectedDate=e.target.value;render();});
  b("chartDate","change",e=>{S.selectedDate=e.target.value;render();});
  b("searchInput","input",e=>{S.searchQ=e.target.value;render();});
  b("loginName","keydown",e=>{if(e.key==="Enter")doLogin();});
  b("loginPw","keydown",e=>{if(e.key==="Enter")doLogin();});
  b("setupName","keydown",e=>{if(e.key==="Enter")doSetup();});
  b("setupPw","keydown",e=>{if(e.key==="Enter")doSetup();});
  b("newName","keydown",e=>{if(e.key==="Enter")doAddMember();});
  b("newSvc","keydown",e=>{if(e.key==="Enter")addSvc();});
  b("gpsEnabled","change",e=>S.settingsEdit.gpsEnabled=e.target.checked?"true":"false");
  b("gpsRadius","input",e=>S.settingsEdit.gpsRadius=e.target.value);
  b("gpsLat","input",e=>S.settingsEdit.gpsLat=e.target.value);
  b("gpsLng","input",e=>S.settingsEdit.gpsLng=e.target.value);
  b("clearFrom","change",e=>S.clearFrom=e.target.value);
  b("clearTo","change",e=>S.clearTo=e.target.value);
  b("jbKeyInput","input",e=>S.jbKeyInput=e.target.value);
  b("jbBinInput","input",e=>S.jbBinInput=e.target.value);
}

// ── ACTIONS ──
function setPage(p){
  S.page=p;
  if(p==="take"&&S.loggedIn)checkGps();
  // For charts, show loading first then render async to avoid hanging
  if(p==="charts"){
    document.getElementById("root").innerHTML=buildApp();
    bindEvents();
    return;
  }
  render();
}
function doLogout(){if(S.idleTimer)clearTimeout(S.idleTimer);S.loggedIn=null;S.page="take";S.gpsStatus=null;S.gpsMessage="";render();}

async function doSetup(){
  const name=(document.getElementById("setupName")||{value:""}).value.trim();
  const pw=(document.getElementById("setupPw")||{value:""}).value.trim();
  if(!name||!pw){S.loginError="Please enter both name and password.";render();return;}
  S.members=[{name,isAdmin:true,password:pw}];
  await jbSave();
  S.loggedIn={name,isAdmin:true,password:pw};S.loginError="";
  render();resetIdleTimer();setTimeout(checkGps,300);
}

function doLogin(){
  const name=(document.getElementById("loginName")||{value:""}).value.trim();
  const pw=(document.getElementById("loginPw")||{value:""}).value.trim();
  const found=S.members.find(m=>m.name.toLowerCase()===name.toLowerCase());
  if(!found){S.loginError="Name not found. Ask an admin to add you.";render();return;}
  if(!found.password){S.loginError="No password set. Ask an admin to reset your password.";render();return;}
  if(found.password!==pw){S.loginError="Incorrect password. Please try again.";render();return;}
  S.loggedIn=found;S.loginError="";S.page="take";
  render();resetIdleTimer();setTimeout(checkGps,300);
}

function toggleM(name){
  if(!S.attendance[attKey()])S.attendance[attKey()]={};
  S.attendance[attKey()][name]=!S.attendance[attKey()][name];
  render();
}

function selectAll(){
  if(!S.loggedIn||!S.loggedIn.isAdmin)return;
  if(!S.attendance[attKey()])S.attendance[attKey()]={};
  S.members.forEach(m=>{S.attendance[attKey()][m.name]=true;});
  render();
}

function deselectAll(){
  if(!S.loggedIn||!S.loggedIn.isAdmin)return;
  if(!S.attendance[attKey()])S.attendance[attKey()]={};
  S.members.forEach(m=>{S.attendance[attKey()][m.name]=false;});
  render();
}
function attKey(){return S.selectedDate+"::"+S.selectedService;}

async function doSave(){
  const gpsOk=S.loggedIn.isAdmin||S.settings.gpsEnabled==="false"||S.gpsStatus==="ok"||S.gpsStatus==="disabled";
  if(!gpsOk)return;
  await jbSave();
  S.saved=true;render();setTimeout(()=>{S.saved=false;render();},2000);
}

async function doAddMember(){
  if(!S.loggedIn||!S.loggedIn.isAdmin)return;
  const name=(document.getElementById("newName")||{value:""}).value.trim();
  const pw=(document.getElementById("newPw")||{value:""}).value.trim();
  const admin=document.getElementById("newAdmin")?.checked||false;
  if(!name){alert("Please enter a name.");return;}
  if(!pw){alert("Please set a password.");return;}
  if(S.members.find(m=>m.name===name)){alert("Member already exists.");return;}
  S.members=[...S.members,{name,isAdmin:admin,password:pw}].sort((a,b)=>a.name.localeCompare(b.name));
  await jbSave();render();
}

async function doRemove(name){
  if(!confirm("Remove "+name+"?"))return;
  S.members=S.members.filter(m=>m.name!==name);
  await jbSave();render();
}

async function toggleAdmin(name){
  S.members=S.members.map(m=>m.name===name?Object.assign({},m,{isAdmin:!m.isAdmin}):m);
  await jbSave();render();
}

async function resetPw(name){
  const pw=prompt("Set new password for "+name+":");
  if(!pw||!pw.trim())return;
  S.members=S.members.map(m=>m.name===name?Object.assign({},m,{password:pw.trim()}):m);
  await jbSave();render();
}

async function doChangePw(){
  const oldPw=(document.getElementById("cpOld")||{value:""}).value.trim();
  const newPw=(document.getElementById("cpNew")||{value:""}).value.trim();
  if(!oldPw||!newPw){S.changePwErr="Please fill in both fields.";render();return;}
  if(oldPw!==S.loggedIn.password){S.changePwErr="Current password is incorrect.";render();return;}
  if(newPw.length<4){S.changePwErr="New password must be at least 4 characters.";render();return;}
  S.members=S.members.map(m=>m.name===S.loggedIn.name?Object.assign({},m,{password:newPw}):m);
  S.loggedIn=Object.assign({},S.loggedIn,{password:newPw});
  S.changePwErr="";S.changePwOk=true;
  await jbSave();render();
  setTimeout(()=>{S.changePwOk=false;render();},2500);
}

function addSvc(){
  const val=(document.getElementById("newSvc")||{value:""}).value.trim();
  if(!val||S.serviceTypes.includes(val))return;
  S.serviceTypes=[...S.serviceTypes,val];render();
}

function removeSvc(i){
  S.serviceTypes=S.serviceTypes.filter((_,idx)=>idx!==i);
  if(!S.serviceTypes.includes(S.selectedService))S.selectedService=S.serviceTypes[0]||"";
  render();
}

async function doSaveServiceTypes(){
  await jbSave();
  S.svcSaved=true;render();setTimeout(()=>{S.svcSaved=false;render();},2000);
}

async function doSaveSettings(){
  S.settings=Object.assign({},S.settingsEdit);
  await jbSave();
  S.settingsSaved=true;render();setTimeout(()=>{S.settingsSaved=false;render();},2000);
}

async function reloadData(){
  try{await jbLoad();render();alert("Data reloaded!");}
  catch(e){alert("Reload failed: "+e.message);}
}

function exportCSV(){
  const rows=[["Date","Service","Member","Status"]];
  Object.keys(S.attendance).sort().forEach(key=>{
    const[date,svc]=key.split("::");
    S.members.forEach(({name})=>{rows.push([date,svc||"",name,S.attendance[key]&&S.attendance[key][name]?"Present":"Absent"]);});
  });
  const csv=rows.map(r=>r.map(c=>'"'+String(c)+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="attendance.csv";a.click();
}

function previewClear(){
  const from=(document.getElementById("clearFrom")||{value:S.clearFrom}).value||S.clearFrom;
  const to=(document.getElementById("clearTo")||{value:S.clearTo}).value||S.clearTo;
  if(!from||!to){alert("Please select both dates.");return;}
  if(from>to){alert("From date must be before To date.");return;}
  S.clearFrom=from;S.clearTo=to;
  S.clearPreview=Object.keys(S.attendance).filter(key=>{const d=key.split("::")[0];return d>=from&&d<=to;}).sort();
  if(S.clearPreview.length===0)alert("No records found in that range.");
  render();
}

async function confirmClear(){
  const count=S.clearPreview.length;if(!count)return;
  if(!confirm("Permanently delete "+count+" record"+(count!==1?"s":"")+"? This cannot be undone."))return;
  S.clearPreview.forEach(k=>{delete S.attendance[k];});
  S.showClear=false;S.clearPreview=[];S.clearFrom="";S.clearTo="";
  await jbSave();render();
  alert("✓ "+count+" record"+(count!==1?"s":"")+" deleted.");
}

function loadHeavyCharts(){
  const btn=document.getElementById("loadChartsBtn");
  const container=document.getElementById("heavyCharts");
  if(!btn||!container)return;
  btn.textContent="⏳ Loading...";btn.disabled=true;

  // Use setTimeout to let the UI update before heavy computation
  setTimeout(()=>{
    const mn=S.members.map(m=>m.name);
    const allKeys=Object.keys(S.attendance).sort((a,b)=>a<b?-1:1);
    const allDates=[...new Set(allKeys.map(k=>k.split("::")[0]))].sort((a,b)=>a<b?-1:1);
    const ACCENT="#c8a95a",GREEN="#56cf8c",RED="#ff7070",CARD="#22223b",LIGHT="#f4f1eb";

    // Grid
    const gridRows=S.members.map(({name},ri)=>{
      const attDays=allDates.filter(d=>allKeys.some(k=>k.startsWith(d+"::") && S.attendance[k]&&S.attendance[k][name])).length;
      const attS=allKeys.filter(k=>S.attendance[k]&&S.attendance[k][name]).length;
      const pct=allKeys.length>0?Math.round(attS/allKeys.length*100):0;
      const bg=ri%2===0?"#1e1e35":CARD;
      let cells="";
      allDates.forEach(d=>{
        const dKeys=allKeys.filter(k=>k.startsWith(d+"::"));
        const allP=dKeys.length>0&&dKeys.every(k=>S.attendance[k]&&S.attendance[k][name]);
        const someP=dKeys.some(k=>S.attendance[k]&&S.attendance[k][name]);
        const col=allP?GREEN:someP?ACCENT:RED;
        const bg2=allP?GREEN+"33":someP?ACCENT+"22":RED+"22";
        const sym=allP?"✓":someP?"~":"✗";
        const sel=d===S.selectedDate;
        cells+=`<td style="${sel?`background:${ACCENT}18`:""}"><span style="display:inline-block;width:22px;height:22px;border-radius:4px;line-height:22px;font-size:12px;background:${bg2};color:${col};border:1px solid ${col}44">${sym}</span></td>`;
      });
      return`<tr><td class="sticky" style="background:${bg}">${name.split(" ")[0].replace(/&/g,"&amp;")}</td>${cells}<td><span style="font-weight:bold;color:${pct>=75?GREEN:pct>=50?ACCENT:RED}">${attDays}/${allDates.length}</span></td></tr>`;
    }).join("");

    const totRow=allDates.map(d=>{
      const c=mn.filter(n=>allKeys.some(k=>k.startsWith(d+"::") && S.attendance[k]&&S.attendance[k][n])).length;
      return`<td style="${d===S.selectedDate?`background:${ACCENT}18`:""};border-top:1px solid ${ACCENT}33"><span style="font-weight:bold;color:${ACCENT}">${c}</span></td>`;
    }).join("");

    // Heatmap
    const months=[...new Set(allDates.map(d=>d.slice(0,7)))].sort();
    const mLabel=m=>new Date(m+"-01").toLocaleDateString("en-US",{month:"short",year:"2-digit"});
    const cColor=p=>p===null?"#ffffff08":p===100?GREEN:p>=75?GREEN+"99":p>=50?ACCENT+"99":p>=25?RED+"88":RED;
    const heatRows=S.members.map(({name})=>{
      const ms=months.map(mon=>{
        const mKeys=allKeys.filter(k=>k.split("::")[0].slice(0,7)===mon);
        const att=mKeys.filter(k=>S.attendance[k]&&S.attendance[k][name]).length;
        return{pct:mKeys.length>0?Math.round(att/mKeys.length*100):null,att,tot:mKeys.length};
      });
      const totS=allKeys.length;
      const attS=allKeys.filter(k=>S.attendance[k]&&S.attendance[k][name]).length;
      const overall=totS>0?Math.round(attS/totS*100):0;
      return{name:name.split(" ")[0],ms,overall,attS,totS};
    }).sort((a,b)=>a.overall-b.overall);

    container.innerHTML=`
      <div style="margin-top:14px">
        <p style="font-size:11px;color:${ACCENT};letter-spacing:1px;margin-bottom:4px">ATTENDANCE GRID</p>
        <div style="display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap">
          ${[[GREEN,"✓ All present"],[ACCENT,"~ Some present"],[RED,"✗ All absent"]].map(([c,l])=>`<span style="font-size:10px;color:${LIGHT}77;display:flex;align-items:center;gap:3px"><span style="display:inline-block;width:14px;height:14px;border-radius:2px;background:${c}33;color:${c};border:1px solid ${c}55;text-align:center;line-height:14px;font-size:8px">${l[0]}</span>${l}</span>`).join("")}
        </div>
        <div style="overflow-x:auto"><table>
          <thead><tr>
            <th class="sticky" style="background:${CARD}">MEMBER</th>
            ${allDates.map(d=>`<th style="min-width:44px">${shortDate(d)}</th>`).join("")}
            <th>TOTAL</th>
          </tr></thead>
          <tbody>${gridRows}</tbody>
          <tfoot><tr><td class="sticky" style="background:${CARD};border-top:1px solid ${ACCENT}33;color:${ACCENT}cc;font-weight:bold">TOTAL</td>${totRow}<td style="border-top:1px solid ${ACCENT}33">—</td></tr></tfoot>
        </table></div>
      </div>
      <div style="margin-top:14px">
        <p style="font-size:11px;color:${ACCENT};letter-spacing:1px;margin-bottom:4px">MONTHLY HEATMAP</p>
        <p style="font-size:11px;color:${LIGHT}55;margin-bottom:8px">% of service sessions attended per month</p>
        <div style="overflow-x:auto"><table>
          <thead><tr><th class="sticky" style="background:${CARD}">MEMBER</th>${months.map(m=>`<th style="min-width:44px">${mLabel(m)}</th>`).join("")}<th>OVERALL</th></tr></thead>
          <tbody>${heatRows.map(({name,ms,overall,attS,totS},ri)=>`<tr style="background:${ri%2===0?"#ffffff05":"transparent"}">
            <td class="sticky" style="background:${ri%2===0?"#1e1e35":CARD}">${name}</td>
            ${ms.map(s=>`<td><div style="margin:0 auto;width:34px;height:22px;border-radius:4px;background:${cColor(s.pct)};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;color:#fff">${s.pct===null?"—":s.pct+"%"}</div></td>`).join("")}
            <td><span style="font-weight:bold;color:${overall>=75?GREEN:overall>=50?ACCENT:RED}">${overall}%</span></td>
          </tr>`).join("")}</tbody>
        </table></div>
        <div style="display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap">
          ${[[GREEN,"100%"],[GREEN+"99","75-99%"],[ACCENT+"99","50-74%"],[RED+"88","25-49%"],[RED,"0-24%"]].map(([c,l])=>`<span style="display:flex;align-items:center;gap:3px;font-size:10px;color:${LIGHT}77"><span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:${c}"></span>${l}</span>`).join("")}
        </div>
      </div>`;

    btn.style.display="none";
  },50);
}

async function refreshData(){
  try{
    await jbLoad();
    render();
  }catch(e){
    alert("Refresh failed: "+e.message);
  }
}

// ── AUTO REFRESH on tab focus ──
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState==="visible"&&S.jbKey&&S.jbBinId){
    try{await jbLoad();render();}catch(e){console.log("Refresh failed:",e.message);}
  }
});
